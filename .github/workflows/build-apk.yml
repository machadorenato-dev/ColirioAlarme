name: Compilar Colirio Alarme

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descompactar projeto
        run: unzip -o ColirioAlarme-source.zip -d projeto

      - name: Compilar APK
        working-directory: projeto/ColirioAlarme
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ColirioAlarme-APK
          path: projeto/ColirioAlarme/app/build/outputs/apk/debug/app-debug.apk
